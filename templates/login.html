<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Waypoint - Login</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234165e1' stroke='%23ffffff' stroke-width='4'/><circle cx='50' cy='30' r='2' fill='%23ffffff'/><line x1='50' y1='50' x2='50' y2='25' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/><line x1='50' y1='50' x2='70' y2='50' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/></svg>">
    <meta name="theme-color" content="#4165e1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #4165e1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(65,101,225,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(15,52,96,0.2) 0%, transparent 50%);
            animation: ambient 8s ease-in-out infinite alternate;
        }
        @keyframes ambient {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-20px, -30px); }
        }
        .card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 40px 28px 32px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 80px rgba(65,101,225,0.1);
            position: relative;
            z-index: 1;
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-icon { font-size: 48px; display: block; margin-bottom: 8px; }
        h1 {
            font-size: 26px; text-align: center; font-weight: 700;
            background: linear-gradient(135deg, #4165e1, #1a3a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .sub {
            text-align: center; color: #98a2b3; font-size: 13px;
            margin-bottom: 24px; line-height: 1.4;
        }
        .sub em { font-style: italic; color: #4165e1; }

        /* Person picker buttons */
        .picker-label {
            text-align: center; font-size: 13px; color: #98a2b3;
            margin-bottom: 14px; letter-spacing: 0.5px;
        }
        .person-grid {
            display: flex; gap: 10px; margin-bottom: 22px;
        }
        .person-btn {
            flex: 1; padding: 14px 8px; border: 2px solid #e8ecf0;
            border-radius: 16px; background: #f8f9fb; cursor: pointer;
            text-align: center; transition: all 0.2s; outline: none;
        }
        .person-btn:hover {
            border-color: #4165e1; background: rgba(65,101,225,0.05);
            transform: translateY(-2px); box-shadow: 0 4px 14px rgba(65,101,225,0.15);
        }
        .person-btn.selected {
            border-color: #4165e1;
            background: rgba(65,101,225,0.08);
            box-shadow: 0 0 0 3px rgba(65,101,225,0.15), 0 4px 14px rgba(65,101,225,0.2);
            transform: translateY(-2px);
        }
        .person-btn:nth-child(2).selected {
            border-color: #e8526b; background: rgba(232,82,107,0.07);
            box-shadow: 0 0 0 3px rgba(232,82,107,0.15), 0 4px 14px rgba(232,82,107,0.2);
        }
        .person-btn:nth-child(3).selected {
            border-color: #27ae60; background: rgba(39,174,96,0.07);
            box-shadow: 0 0 0 3px rgba(39,174,96,0.15), 0 4px 14px rgba(39,174,96,0.2);
        }
        .person-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #4165e1, #2a4fd6);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 8px; font-size: 19px; font-weight: 700; color: white;
            box-shadow: 0 3px 10px rgba(65,101,225,0.35);
            transition: transform 0.2s;
        }
        .person-btn:hover .person-avatar { transform: scale(1.08); }
        .person-btn:nth-child(2) .person-avatar {
            background: linear-gradient(135deg, #e8526b, #c93350);
            box-shadow: 0 3px 10px rgba(232,82,107,0.35);
        }
        .person-btn:nth-child(3) .person-avatar {
            background: linear-gradient(135deg, #2ecc71, #1fa855);
            box-shadow: 0 3px 10px rgba(39,174,96,0.35);
        }
        .person-name { font-size: 14px; font-weight: 600; color: #1a1a2e; }

        input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #e8ecf0; border-radius: 14px;
            background: #f8f9fb; color: #1a1a2e;
            font-size: 16px; margin-bottom: 12px; outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #4165e1; background: white;
            box-shadow: 0 0 0 4px rgba(65,101,225,0.1);
        }
        input::placeholder { color: #b0b8c4; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4165e1, #2a4fd6);
            color: white; box-shadow: 0 4px 14px rgba(65,101,225,0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(65,101,225,0.4);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; transform: none; }
        .error {
            color: #e53935; font-size: 13px; text-align: center;
            margin-bottom: 12px; min-height: 20px;
            background: rgba(229,57,53,0.08);
            padding: 8px 12px; border-radius: 10px; display: none;
        }
        .error.show { display: block; }
        .pin-input { letter-spacing: 6px; font-size: 20px; text-align: center; font-weight: 600; }
        .footer-text {
            text-align: center; margin-top: 20px; font-size: 11px;
            color: rgba(255,255,255,0.3); position: relative; z-index: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <span class="logo-icon">🧭</span>
            <h1>Waypoint</h1>
        </div>
        <p class="sub">Life is a journey — <em>tasks are your checkpoints</em></p>

        <div class="picker-label">👤 Who's checking in?</div>
        <div class="person-grid">
            <button type="button" class="person-btn" data-user="Ben">
                <div class="person-avatar">B</div>
                <div class="person-name">Ben</div>
            </button>
            <button type="button" class="person-btn" data-user="Rachel">
                <div class="person-avatar">R</div>
                <div class="person-name">Rachel</div>
            </button>
            <button type="button" class="person-btn" data-user="Sam">
                <div class="person-avatar">S</div>
                <div class="person-name">Sam</div>
            </button>
        </div>

        <div class="error" id="error"></div>
        <form id="authForm">
            <input type="hidden" id="username" value="">
            <input type="password" id="pin" class="pin-input" placeholder="Enter PIN" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" required disabled>
            <button type="submit" class="btn btn-primary" id="authBtn" disabled>Select someone first</button>
        </form>
    </div>
    <div class="footer-text">Waypoint © 2026</div>

    <script>
        let selectedUser = null;
        const form = document.getElementById('authForm');
        const errorEl = document.getElementById('error');
        const authBtn = document.getElementById('authBtn');
        const pinInput = document.getElementById('pin');
        const usernameInput = document.getElementById('username');
        const personBtns = document.querySelectorAll('.person-btn');

        function setError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.toggle('show', !!msg);
        }

        personBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                personBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedUser = btn.dataset.user;
                usernameInput.value = selectedUser;
                pinInput.disabled = false;
                pinInput.focus();
                authBtn.disabled = false;
                authBtn.textContent = `Log in as ${selectedUser}`;
                setError('');
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value;
            const pin = pinInput.value;
            if (!username || pin.length < 4) {
                setError('Select who you are and enter your PIN (4+ digits)');
                return;
            }
            authBtn.disabled = true;
            authBtn.textContent = 'Checking...';
            setError('');
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, pin })
                });
                if (!res.ok) {
                    const msg = await res.text();
                    throw new Error('Invalid PIN. Try again.');
                }
                window.location.href = '/';
            } catch (err) {
                setError(err.message);
                pinInput.value = '';
                pinInput.focus();
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = `Log in as ${selectedUser || '...'}`;
            }
        });

        // Enter key on PIN submits form
        pinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
