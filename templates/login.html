<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Waypoint - Login</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%234165e1' stroke='%23ffffff' stroke-width='4'/><circle cx='50' cy='30' r='2' fill='%23ffffff'/><line x1='50' y1='50' x2='50' y2='25' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/><line x1='50' y1='50' x2='70' y2='50' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/></svg>">
    <meta name="theme-color" content="#4165e1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #4165e1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(65,101,225,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(15,52,96,0.2) 0%, transparent 50%);
            animation: ambient 8s ease-in-out infinite alternate;
        }
        @keyframes ambient {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-20px, -30px); }
        }
        .card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 44px 32px 36px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 80px rgba(65,101,225,0.1);
            position: relative;
            z-index: 1;
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 26px;
            text-align: center;
            font-weight: 700;
            background: linear-gradient(135deg, #4165e1, #1a3a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .sub {
            text-align: center;
            color: #98a2b3;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.4;
        }
        .sub em {
            font-style: italic;
            color: #4165e1;
        }
        .divider {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .divider::after {
            content: '✧';
            color: #4165e1;
            font-size: 14px;
            opacity: 0.4;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8ecf0;
            border-radius: 14px;
            background: #f8f9fb;
            color: #1a1a2e;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #4165e1;
            background: white;
            box-shadow: 0 0 0 4px rgba(65,101,225,0.1);
        }
        input::placeholder { color: #b0b8c4; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4165e1, #2a4fd6);
            color: white;
            box-shadow: 0 4px 14px rgba(65,101,225,0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(65,101,225,0.4);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; transform: none; }
        .btn-secondary {
            background: transparent;
            color: #4165e1;
            border: 2px solid #4165e1;
            margin-top: 10px;
        }
        .btn-secondary:hover { background: rgba(65,101,225,0.05); }
        .error {
            color: #e53935;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 20px;
            background: rgba(229,57,53,0.08);
            padding: 8px 12px;
            border-radius: 10px;
            display: none;
        }
        .error.show { display: block; }
        .toggle { text-align: center; margin-top: 18px; font-size: 14px; color: #98a2b3; }
        .toggle a { color: #4165e1; text-decoration: none; cursor: pointer; font-weight: 600; }
        .pin-input { letter-spacing: 6px; font-size: 20px; text-align: center; font-weight: 600; }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <span class="logo-icon">🧭</span>
            <h1>Waypoint</h1>
        </div>
        <p class="sub">Life is a journey — <em>tasks are your checkpoints</em></p>
        <div class="divider"></div>
        <div class="error" id="error"></div>
        <form id="authForm">
            <input type="text" id="username" placeholder="Username" autocomplete="username" required>
            <input type="password" id="pin" class="pin-input" placeholder="PIN (4+ digits)" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" required>
            <button type="submit" class="btn btn-primary" id="authBtn">Login</button>
        </form>
        <div class="toggle">
            <span id="toggleText">Don't have an account?</span>
            <a id="toggleLink">Register</a>
        </div>
    </div>
    <div class="footer-text">Waypoint © 2026</div>

    <script>
        let isLogin = true;
        const form = document.getElementById('authForm');
        const errorEl = document.getElementById('error');
        const authBtn = document.getElementById('authBtn');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');

        function setError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.toggle('show', !!msg);
        }
        toggleLink.addEventListener('click', () => {
            isLogin = !isLogin;
            authBtn.textContent = isLogin ? 'Login' : 'Register';
            toggleText.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
            toggleLink.textContent = isLogin ? 'Register' : 'Login';
            setError('');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const pin = document.getElementById('pin').value;
            if (!username || pin.length < 4) {
                setError('Username and PIN (4+ digits) required');
                return;
            }
            authBtn.disabled = true;
            authBtn.textContent = 'Loading...';
            setError('');

            const endpoint = isLogin ? '/api/login' : '/api/register';
            const data = JSON.stringify({ username, pin });
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: data
                });
                if (!res.ok) {
                    const msg = await res.text();
                    throw new Error(msg.includes('taken') ? 'Username already taken' : msg.includes('Invalid') ? 'Invalid username or PIN' : 'Something went wrong');
                }
                window.location.href = '/';
            } catch (err) {
                setError(err.message);
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = isLogin ? 'Login' : 'Register';
            }
        });
    </script>
</body>
</html>
